syntax = "proto3";
package bluechipchain.liquidityvault;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "google/protobuf/timestamp.proto";
import "bluechipchain/liquidityvault/params.proto";
import "bluechipchain/liquidityvault/pool.proto";
import "bluechipchain/liquidityvault/valuepost.proto";
import "bluechipchain/liquidityvault/vault.proto";

option go_package = "bluechipChain/x/liquidityvault/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/params";
  }

  // Vault queries a validator's Liquidity Vault, including any withdrawals
  // waiting out the grace period.
  rpc Vault(QueryVaultRequest) returns (QueryVaultResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/vault/{validator_address}";
  }

  // Vaults queries all Liquidity Vaults.
  rpc Vaults(QueryVaultsRequest) returns (QueryVaultsResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/vaults";
  }

  // CompositeScore queries a validator's composite score: its tokens staked
  // directly to the chain plus its vault value (active balance and valued
  // pool positions).
  rpc CompositeScore(QueryCompositeScoreRequest) returns (QueryCompositeScoreResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/composite_score/{validator_address}";
  }

  // Pools queries all registered liquidity pools.
  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/pools";
  }

  // Positions queries a validator's pool positions, valued at current pool
  // prices, including pending deallocations.
  rpc Positions(QueryPositionsRequest) returns (QueryPositionsResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/positions/{validator_address}";
  }

  // ValuePosts queries a validator's rolling value-post window and the
  // median derived from it.
  rpc ValuePosts(QueryValuePostsRequest) returns (QueryValuePostsResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/value_posts/{validator_address}";
  }

  // SetRanking is a SHADOW of the design document's complex validator-set
  // check: all validators ranked by staked tokens with the composite score
  // as tiebreaker. Observability only — it has no effect on the actual
  // validator set in stage 1.
  rpc SetRanking(QuerySetRankingRequest) returns (QuerySetRankingResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/set_ranking";
  }

  // DelegatorReward queries a delegator's claimable vault rewards from one
  // validator (settled accrual plus the unsettled projection at the current
  // index).
  rpc DelegatorReward(QueryDelegatorRewardRequest) returns (QueryDelegatorRewardResponse) {
    option (google.api.http).get = "/bluechipChain/liquidityvault/delegator_reward/{delegator_address}/{validator_address}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryVaultRequest is request type for the Query/Vault RPC method.
message QueryVaultRequest {
  // validator_address is the operator address of the validator whose vault is
  // queried.
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryVaultResponse is response type for the Query/Vault RPC method.
message QueryVaultResponse {
  // vault is the validator's Liquidity Vault.
  Vault vault = 1 [(gogoproto.nullable) = false];

  // pending_withdrawals are the vault's withdrawals still waiting out the
  // grace period.
  repeated PendingWithdrawal pending_withdrawals = 2 [(gogoproto.nullable) = false];
}

// QueryVaultsRequest is request type for the Query/Vaults RPC method.
message QueryVaultsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryVaultsResponse is response type for the Query/Vaults RPC method.
message QueryVaultsResponse {
  // vaults are the Liquidity Vaults of all validators.
  repeated Vault vaults = 1 [(gogoproto.nullable) = false];

  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryCompositeScoreRequest is request type for the Query/CompositeScore RPC
// method.
message QueryCompositeScoreRequest {
  // validator_address is the operator address of the validator whose
  // composite score is queried.
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryCompositeScoreResponse is response type for the Query/CompositeScore
// RPC method.
message QueryCompositeScoreResponse {
  // staked_tokens are the tokens delegated directly to the validator on the
  // chain.
  string staked_tokens = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // vault_balance is the validator's active Liquidity Vault balance.
  string vault_balance = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // composite_score is staked_tokens + vault_balance + position_value.
  string composite_score = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // position_value is the current value of the validator's pool positions
  // in the bond denom.
  string position_value = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // median_vault_value is the median of the vault's value posts — the vault
  // component actually used in composite_score once posts exist. Before the
  // first post it equals the live vault value.
  string median_vault_value = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// QueryPoolsRequest is request type for the Query/Pools RPC method.
message QueryPoolsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryPoolsResponse is response type for the Query/Pools RPC method.
message QueryPoolsResponse {
  // pools are the registered liquidity pools.
  repeated RegisteredPool pools = 1 [(gogoproto.nullable) = false];

  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPositionsRequest is request type for the Query/Positions RPC method.
message QueryPositionsRequest {
  // validator_address is the operator address of the validator whose pool
  // positions are queried.
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// PositionView is a validator's position in one pool with its current value.
message PositionView {
  // position is the validator's internal share record.
  PoolPosition position = 1 [(gogoproto.nullable) = false];

  // value is the position's current value in the bond denom, at current pool
  // prices.
  string value = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// QueryPositionsResponse is response type for the Query/Positions RPC
// method.
message QueryPositionsResponse {
  // positions are the validator's pool positions with current values.
  repeated PositionView positions = 1 [(gogoproto.nullable) = false];

  // pending_deallocations are the validator's pool exits still waiting out
  // the deallocation grace period.
  repeated PendingDeallocation pending_deallocations = 2 [(gogoproto.nullable) = false];
}

// QueryValuePostsRequest is request type for the Query/ValuePosts RPC
// method.
message QueryValuePostsRequest {
  // validator_address is the operator address of the validator whose value
  // posts are queried.
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryValuePostsResponse is response type for the Query/ValuePosts RPC
// method.
message QueryValuePostsResponse {
  // posts are the validator's retained value posts, oldest first.
  repeated ValuePost posts = 1 [(gogoproto.nullable) = false];

  // median is the median of the retained posts (zero when there are none).
  string median = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // next_post_time is when the next snapshot is due; unset when nothing is
  // scheduled (e.g. the validator has no vault).
  google.protobuf.Timestamp next_post_time = 3 [(gogoproto.stdtime) = true];
}

// QuerySetRankingRequest is request type for the Query/SetRanking RPC
// method.
message QuerySetRankingRequest {}

// RankedValidator is one row of the shadow set ranking.
message RankedValidator {
  // validator_address is the operator address of the validator.
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];

  // staked_tokens are the tokens delegated directly to the validator.
  string staked_tokens = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // median_vault_value is the median-of-posts vault value used as the
  // tiebreaker.
  string median_vault_value = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // composite_score is staked_tokens + median_vault_value.
  string composite_score = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// QuerySetRankingResponse is response type for the Query/SetRanking RPC
// method: validators ordered by staked tokens descending, composite score
// as tiebreaker — the design document's complex check, in shadow mode.
message QuerySetRankingResponse {
  // validators are the ranked validators, best first.
  repeated RankedValidator validators = 1 [(gogoproto.nullable) = false];
}

// QueryDelegatorRewardRequest is request type for the Query/DelegatorReward
// RPC method.
message QueryDelegatorRewardRequest {
  // delegator_address is the delegator's account address.
  string delegator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // validator_address is the validator whose vault rewards are queried.
  string validator_address = 2 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryDelegatorRewardResponse is response type for the
// Query/DelegatorReward RPC method.
message QueryDelegatorRewardResponse {
  // claimable is the bond-denom amount a claim would pay out right now.
  string claimable = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
